name: elektronicare_flutter
description: ElektroniCare Flutter - Electronic Repair Service App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Core UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  
  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9
  
  # Firebase (Compatible versions)
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_messaging: ^14.7.10
  google_sign_in: ^6.2.1
  
  # Navigation
  go_router: ^12.1.3
  
  # HTTP
  http: ^1.1.2
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Image
  image_picker: ^1.0.4
  cloudinary_public: ^0.21.0
  
  # Utils
  intl: ^0.18.1
  uuid: ^4.2.1
  url_launcher: ^6.2.2
  
  # Form
  form_builder_validators: ^9.1.0
  
  # Email
  mailer: ^6.1.2
  
  # UI Enhancements
  flutter_rating_bar: ^4.0.1
  fl_chart: ^0.65.0
  
  # Location
  geolocator: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700